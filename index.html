<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>THS Field Pro — ABC Dispatch</title>
  <style>
    :root { --teal:#04413a; --gold:#c8960c; --bg:#f1f5f9; --border:#cbd5e1; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: #1e293b; padding-bottom: 120px; }

    /* ── APP UI ── */
    .hdr { background: var(--teal); padding: 15px; border-bottom: 5px solid var(--gold); position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
    .hdr-title { color: white; font-weight: 900; font-size: 0.9rem; }
    .btn-abc { background: var(--gold); color: black; border: none; padding: 10px 15px; border-radius: 8px; font-weight: 900; font-size: 0.75rem; cursor: pointer; }
    
    .main { padding: 15px; max-width: 700px; margin: auto; }
    .line-card { background: white; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; overflow: hidden; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    .line-hdr { background: #f8fafc; padding: 12px; border-bottom: 2px solid #e2e8f0; display: flex; gap: 10px; align-items: center; }
    
    .unit-row { padding: 15px; border-bottom: 1px solid #f1f5f9; position: relative; }
    .unit-grid { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    
    .fi { width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 1rem; outline: none; background: #fff; }
    .fi:focus { border-color: var(--teal); }
    
    /* ── FLASH LABEL SYSTEM ── */
    #flashOverlay { display: none; position: fixed; inset: 0; background: white; z-index: 9999; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    #flashOverlay.active { display: flex; }
    .flash-num { font-size: 10rem; font-weight: 900; color: var(--teal); line-height: 1; }
    .flash-loc { font-size: 2rem; font-weight: 700; color: var(--gold); text-transform: uppercase; }

    /* ── BUTTONS ── */
    .btn-add { background: var(--teal); color: white; border: none; padding: 15px; border-radius: 10px; width: 100%; font-weight: 900; font-size: 1rem; margin-top: 10px; cursor: pointer; }
    .btn-label { background: #e2e8f0; border: none; padding: 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 700; color: var(--teal); cursor: pointer; }
    .btn-del { color: #ef4444; border: none; background: none; font-size: 0.7rem; cursor: pointer; }

    /* ── PRINT REPORT (FOR JOSHUA) ── */
    #printArea { display: none; }
    @media print {
      body * { display: none !important; }
      #printArea { display: block !important; padding: 30px; background: white; }
      .p-group { border: 2px solid var(--teal); margin-bottom: 25px; page-break-inside: avoid; }
      .p-group-hdr { background: var(--teal); color: white; padding: 10px; font-weight: bold; font-size: 1.2rem; }
      table { width: 100%; border-collapse: collapse; }
      th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
      th { background: #f8fafc; }
    }
  </style>
</head>
<body>

<div id="flashOverlay" onclick="this.classList.remove('active')">
  <div class="flash-loc" id="fLoc">KITCHEN</div>
  <div class="flash-num" id="fNum">4</div>
  <p style="margin-top:20px; color:#666;">Snap a photo of this screen,<br>then the window.</p>
</div>

<div id="app">
  <div class="hdr">
    <div class="hdr-title" onclick="location.reload()">THS FIELD PRO</div>
    <button class="btn-abc" onclick="generateABCReport()">SEND TO JOSHUA ✉️</button>
  </div>

  <div class="main">
    <input class="fi" id="jobName" placeholder="Customer Name (e.g. Smith Residence)" style="font-weight:900; margin-bottom:20px; font-size:1.2rem;">
    <div id="linesContainer"></div>
    <button class="btn-add" onclick="addLine()">+ NEW WINDOW/DOOR LINE</button>
  </div>
</div>

<div id="printArea">
  <h1 style="color:#04413a">FIELD MEASURE REPORT</h1>
  <p id="pJobInfo" style="font-size:1.2rem; margin:10px 0 20px 0;"></p>
  <div id="pContent"></div>
  <div style="margin-top:30px; border-top:1px solid #ccc; padding-top:10px; font-size:0.8rem; color:#666;">
    Verified by Total Home Services of Georgia. Photos attached to email follow the numeric "Photo Key" in report.
  </div>
</div>

<script>
const JOSHUA = "Joshua.Taylor@abcsupply.com";
let jobData = JSON.parse(localStorage.getItem('ths_joshua_v1') || '{"name":"","lines":[]}');

function save() { localStorage.setItem('ths_joshua_v1', JSON.stringify(jobData)); }

function addLine() {
  jobData.lines.push({ brand: "", units: [{ loc: "", w: "", h: "", pRef: "" }] });
  render();
}

function addUnit(lIdx) {
  jobData.lines[lIdx].units.push({ loc: "", w: "", h: "", pRef: "" });
  render();
}

function showFlash(lIdx, uIdx) {
  const u = jobData.lines[lIdx].units[uIdx];
  document.getElementById('fLoc').innerText = u.loc || 'NEW UNIT';
  document.getElementById('fNum').innerText = uIdx + 1;
  document.getElementById('flashOverlay').classList.add('active');
}

function render() {
  save();
  const container = document.getElementById('linesContainer');
  container.innerHTML = '';
  document.getElementById('jobName').value = jobData.name;

  jobData.lines.forEach((line, lIdx) => {
    let card = document.createElement('div');
    card.className = 'line-card';
    card.innerHTML = `
      <div class="line-hdr">
        <input class="fi" placeholder="Product Line (e.g. Andersen 400)" value="${line.brand}" oninput="jobData.lines[${lIdx}].brand=this.value; save()">
        <button class="btn-label" onclick="addUnit(${lIdx})">+ UNIT</button>
      </div>
      <div id="units-${lIdx}">
        ${line.units.map((u, uIdx) => `
          <div class="unit-row">
            <div class="unit-grid">
              <input class="fi" placeholder="Room" value="${u.loc}" oninput="jobData.lines[${lIdx}].units[${uIdx}].loc=this.value; save()">
              <input class="fi" placeholder="W" value="${u.w}" oninput="jobData.lines[${lIdx}].units[${uIdx}].w=this.value; save()">
              <input class="fi" placeholder="H" value="${u.h}" oninput="jobData.lines[${lIdx}].units[${uIdx}].h=this.value; save()">
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <button class="btn-label" onclick="showFlash(${lIdx}, ${uIdx})">📸 FLASH LABEL</button>
              <input class="fi" style="width:100px; padding:5px; font-size:0.7rem; border-color:var(--gold)" placeholder="Photo Ref" value="${u.pRef}" oninput="jobData.lines[${lIdx}].units[${uIdx}].pRef=this.value; save()">
              <button class="btn-del" onclick="jobData.lines[${lIdx}].units.splice(${uIdx},1); render()">DELETE</button>
            </div>
          </div>
        `).join('')}
      </div>
    `;
    container.appendChild(card);
  });
}

function generateABCReport() {
  jobData.name = document.getElementById('jobName').value;
  if(!jobData.name) return alert("Enter Customer Name first");

  document.getElementById('pJobInfo').innerText = `JOB: ${jobData.name} | Date: ${new Date().toLocaleDateString()}`;
  const pContent = document.getElementById('pContent');
  pContent.innerHTML = '';

  jobData.lines.forEach(line => {
    let section = `
      <div class="p-group">
        <div class="p-group-hdr">LINE: ${line.brand || 'Standard'}</div>
        <table>
          <thead><tr><th>#</th><th>Location</th><th>Size</th><th>Photo Reference</th></tr></thead>
          <tbody>
            ${line.units.map((u, i) => `
              <tr>
                <td>${i+1}</td>
                <td>${u.loc}</td>
                <td><strong>${u.w}" x ${u.h}"</strong></td>
                <td style="color:red; font-weight:bold;">${u.pRef || 'See Labels'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
    pContent.innerHTML += section;
  });

  window.print();

  setTimeout(() => {
    const subject = encodeURIComponent(`MEASURE SHEET: ${jobData.name}`);
    const body = encodeURIComponent(`Hi Joshua,\n\nI've attached the measure sheet for ${jobData.name}.\n\nI have separated the units into ${jobData.lines.length} specific window/door lines. I used "Flash Labels" in the photos to act as title cards between each unit.\n\nPlease let me know if you need anything else to get the quote started.\n\nThanks,\nCameron\nTotal Home Services of Georgia`);
    window.location.href = `mailto:${JOSHUA}?subject=${subject}&body=${body}`;
  }, 1000);
}

document.getElementById('jobName').oninput = (e) => { jobData.name = e.target.value; save(); };
render();
</script>
</body>
</html>
